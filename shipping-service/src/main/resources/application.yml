server:
  port: 8083

spring:
  application:
    name: shipping-service
  datasource:
    url: ${DB_SHIPPING_URL}
    username: ${DB_SHIPPING_USER}
    password: ${DB_SHIPPING_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
