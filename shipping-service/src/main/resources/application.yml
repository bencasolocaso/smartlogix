server:
  port: 8083

spring:
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://shipping-db:5432/shipping
    username: shipping_user
    password: shipping_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
